name: Release desktop applications

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: v<version> from package.json)'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      skip_macos:
        description: 'Keep existing macOS assets when extending a release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple silicon + Intel)
    if: ${{ github.event_name == 'push' || !inputs.skip_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build macOS packages
        run: npm run build:mac -- --config.forceCodeSigning=true --config.mac.notarize=true
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-macos
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build Windows packages
        run: npm run build:win -- --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v7
        with:
          name: installers-windows-x64
          path: |
            dist/*.exe
            dist/*-win.zip
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build Linux x64 packages
        run: npm run build:linux -- --x64
      - uses: actions/upload-artifact@v7
        with:
          name: installers-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build Linux ARM64 AppImage
        run: npm run build:linux -- --arm64
      - uses: actions/upload-artifact@v7
        with:
          name: installers-linux-arm64
          path: |
            dist/*.AppImage
            dist/latest-linux*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: ${{ always() && needs.build-windows.result == 'success' && needs.build-linux-x64.result == 'success' && needs.build-linux-arm64.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    needs: [build-macos, build-windows, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: artifacts
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create or update release and upload packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            FLAGS=(--title "OffsetDock ${TAG#v}" --notes-file RELEASE_NOTES.md)
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          gh release edit "$TAG" --notes-file RELEASE_NOTES.md --latest
